name: Capture live BlckWhte screenshots

on:
  push:
    paths:
      - '.github/workflows/capture-live.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser API
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright-core
          CHROME_PATH="$(which google-chrome || which google-chrome-stable || which chromium || which chromium-browser)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Capture from live deployment
        env:
          LIVE_URL: https://blckwhte.onrender.com
        run: |
          mkdir -p assets
          cat > capture.js <<'NODE'
          const { chromium } = require('playwright-core');
          const LIVE_URL = process.env.LIVE_URL;

          async function enterName(page, name) {
            await page.goto(LIVE_URL, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(1200);
            if (await page.locator('#name-input').isVisible().catch(() => false)) {
              await page.fill('#name-input', name);
              await page.click('#name-btn');
              await page.waitForTimeout(500);
            }
          }

          (async () => {
            const browser = await chromium.launch({ headless: true, executablePath: process.env.CHROME_PATH });

            const hostCtx = await browser.newContext({ viewport: { width: 430, height: 932 }, deviceScaleFactor: 1.5 });
            const host = await hostCtx.newPage();
            await enterName(host, 'Aditya');
            await host.screenshot({ path: 'assets/live-home.png', fullPage: true });
            await host.getByText('Create Game', { exact: true }).first().click();
            await host.waitForSelector('#lobby-code-display .code-digit', { timeout: 30000 });
            const code = (await host.locator('#lobby-code-display .code-digit').allTextContents()).join('');

            const guest1Ctx = await browser.newContext({ viewport: { width: 430, height: 932 }, deviceScaleFactor: 1.5 });
            const guest1 = await guest1Ctx.newPage();
            await enterName(guest1, 'Sanskriti');
            await guest1.getByText('Join Game', { exact: true }).first().click();
            await guest1.fill('#join-code-input', code);
            await guest1.click('#join-btn');

            const guest2Ctx = await browser.newContext({ viewport: { width: 430, height: 932 }, deviceScaleFactor: 1.5 });
            const guest2 = await guest2Ctx.newPage();
            await enterName(guest2, 'Alex');
            await guest2.getByText('Join Game', { exact: true }).first().click();
            await guest2.fill('#join-code-input', code);
            await guest2.click('#join-btn');

            await host.waitForFunction(() => {
              const btn = document.querySelector('#lobby-start-btn');
              return btn && !btn.disabled;
            }, { timeout: 30000 });
            await host.waitForTimeout(700);
            await host.screenshot({ path: 'assets/live-lobby.png', fullPage: true });

            await host.click('#lobby-start-btn');
            await host.waitForSelector('#giver-boxes input', { timeout: 30000 });
            const letters = ['C', 'A', 'K', 'E'];
            const boxes = host.locator('#giver-boxes input');
            for (let i = 0; i < 4; i++) await boxes.nth(i).fill(letters[i]);
            await host.click('#giver-submit-btn');

            await guest1.waitForSelector('#guess-input', { timeout: 30000 });
            await guest1.fill('#guess-input', 'BIRD');
            await guest1.click('#guess-btn');
            await guest1.waitForTimeout(600);
            await guest1.fill('#guess-input', 'COAT');
            await guest1.click('#guess-btn');
            await guest1.waitForTimeout(600);
            await guest1.screenshot({ path: 'assets/live-gameplay.png', fullPage: true });

            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
          node capture.js

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/live-home.png assets/live-lobby.png assets/live-gameplay.png
          git commit -m "Add screenshots from live BlckWhte deployment [skip ci]" || exit 0
          git push
